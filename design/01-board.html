<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 갤러리 — you4ranghe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────
   프로젝트 갤러리 — 모니터 화면 안에서 도는 페이지
   목록 ⇄ 상세 두 화면. 해시로 이동한다.
   ───────────────────────────────────────────── */

:root{
  --paper:#F6F6F3;
  --ink:#16161A;
  --ink-70:rgba(22,22,26,.68);
  --ink-45:rgba(22,22,26,.45);
  --rule:rgba(22,22,26,.13);

  --display:"Black Han Sans","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Malgun Gothic",-apple-system,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;

  --pad:clamp(18px,3.6vw,54px);
  --ease:cubic-bezier(.22,.9,.24,1);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-weight:300;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--acc,#1B3BCF);outline-offset:3px}

/* ── 상단 ──────────────────────────────────── */
.top{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:13px var(--pad);background:var(--paper);border-bottom:1px solid var(--rule);
}
.top__id{font-family:var(--mono);font-size:12.5px;font-weight:600;letter-spacing:.02em}
.top__id em{font-style:normal;color:var(--ink-45);font-weight:400}
.top__links{display:flex;gap:16px;font-family:var(--mono);font-size:12px}
.top__links a{text-decoration:none;color:var(--ink-70);padding-bottom:2px;border-bottom:1px solid transparent}
.top__links a:hover{color:var(--ink);border-bottom-color:var(--ink)}

/* ── 화면 전환 ─────────────────────────────── */
.view{display:none;animation:fade .38s var(--ease)}
.view.is-on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ═══ 목록 화면 ═══════════════════════════════ */
.head{padding:clamp(30px,5vw,64px) var(--pad) clamp(18px,2.6vw,30px)}
.head__eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-45);margin:0 0 14px}
.head__h{font-family:var(--display);font-size:clamp(38px,7vw,84px);line-height:.96;
  letter-spacing:-.015em;margin:0}
.head__h span{color:#0B4F4A}
.head__sub{margin:16px 0 0;font-size:15.5px;color:var(--ink-70);max-width:56ch}

.stats{display:flex;flex-wrap:wrap;gap:clamp(18px,4vw,48px);
  padding:0 var(--pad) clamp(18px,2.6vw,28px)}
.stats div{min-width:96px}
.stats dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-45);margin-bottom:5px}
.stats dd{margin:0;font-family:var(--mono);font-size:22px;font-weight:500}
.stats dd small{font-size:12px;color:var(--ink-45);font-weight:400;margin-left:3px}

.filter{
  position:sticky;top:45px;z-index:40;background:var(--paper);
  padding:13px var(--pad);border-top:1px solid var(--rule);border-bottom:2px solid var(--ink);
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
}
.filter__k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-45);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font-family:var(--mono);font-size:12px;padding:5px 12px;border:1px solid var(--rule);
  border-radius:999px;color:var(--ink-70);transition:.15s}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.filter__n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--ink-45)}

.bands{border-bottom:2px solid var(--ink)}
.band{position:relative;display:block;width:100%;text-align:left;
  border-bottom:1px solid var(--rule);overflow:hidden;isolation:isolate}
.band:last-child{border-bottom:0}
.band::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--c);
  transform:scaleX(0);transform-origin:left center;
  transition:transform .44s var(--ease)}
.band:hover::before,.band:focus-visible::before{transform:scaleX(1)}
.band__in{display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:start;
  gap:clamp(14px,2.6vw,34px);padding:clamp(18px,2.6vw,30px) var(--pad);
  transition:color .3s .05s}
.band:hover .band__in,.band:focus-visible .band__in{color:var(--paper)}
.band__no{font-family:var(--mono);font-size:12.5px;font-weight:600;padding-top:5px;color:var(--ink-45);
  transition:color .3s .05s}
.band:hover .band__no,.band:focus-visible .band__no{color:rgba(255,255,255,.6)}
.band__t{font-family:var(--display);font-size:clamp(22px,3.4vw,42px);line-height:1.04;
  margin:0 0 6px;letter-spacing:-.01em;transition:transform .44s var(--ease)}
.band:hover .band__t,.band:focus-visible .band__t{transform:translateX(10px)}
.band__repo{font-family:var(--mono);font-size:12px;color:var(--ink-45);display:block;margin-bottom:10px;
  transition:color .3s .05s}
.band:hover .band__repo,.band:focus-visible .band__repo{color:rgba(255,255,255,.66)}
.band__s{margin:0 0 12px;font-size:15px;max-width:66ch;line-height:1.6}
.band__tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.band__tags li{font-family:var(--mono);font-size:11px;padding:3px 9px;border:1px solid currentColor;
  border-radius:3px;opacity:.6}
.band__r{text-align:right;font-family:var(--mono);font-size:11.5px;color:var(--ink-45);padding-top:5px;
  white-space:nowrap;transition:color .3s .05s}
.band:hover .band__r,.band:focus-visible .band__r{color:rgba(255,255,255,.72)}
.band__r b{display:block;font-weight:500;margin-bottom:4px}
.band__go{display:block;font-size:19px;margin-top:9px;line-height:1}
.band.is-hidden{display:none}

/* ═══ 상세 화면 ═══════════════════════════════ */
.d-hero{padding:clamp(24px,4vw,52px) var(--pad) clamp(20px,3vw,34px);
  background:var(--c);color:var(--paper);position:relative}
.d-back{font-family:var(--mono);font-size:12px;display:inline-flex;align-items:center;gap:7px;
  padding:8px 15px;border-radius:999px;background:rgba(255,255,255,.16);margin-bottom:clamp(18px,3vw,32px);
  transition:background .16s}
.d-back:hover{background:rgba(255,255,255,.3)}
.d-cat{font-family:var(--mono);font-size:11px;letter-spacing:.18em;opacity:.72;margin:0 0 10px}
.d-h{font-family:var(--display);font-size:clamp(32px,6vw,72px);line-height:1;margin:0 0 12px;
  letter-spacing:-.015em}
.d-sum{margin:0;font-size:16.5px;max-width:62ch;line-height:1.7;opacity:.92}

/* GitHub 카드 */
.gh{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
  gap:0;border-bottom:2px solid var(--ink);background:var(--ink);color:var(--paper);
}
.gh__cell{padding:16px var(--pad);border-right:1px solid rgba(255,255,255,.12)}
.gh__cell:last-child{border-right:0}
.gh__k{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  opacity:.5;margin:0 0 6px}
.gh__v{font-family:var(--mono);font-size:14.5px;margin:0;display:flex;align-items:center;gap:7px}
.gh__dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}

.d-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);
  gap:clamp(24px,4vw,60px);padding:clamp(28px,4vw,56px) var(--pad)}
.sec{margin:0 0 clamp(26px,3.4vw,42px)}
.sec:last-child{margin-bottom:0}
.sec__k{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-45);margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.sec p{margin:0 0 13px;font-size:15.5px;line-height:1.85;max-width:64ch}
.sec p:last-child{margin-bottom:0}
.sec ul{margin:0;padding-left:1.1em}
.sec li{font-size:15.5px;line-height:1.8;margin-bottom:8px}
.sec li b{font-weight:500}

.qa{border-left:3px solid var(--c);padding:2px 0 2px 18px;margin:0 0 20px}
.qa__q{font-family:var(--display);font-size:19px;margin:0 0 8px;line-height:1.35}
.qa__a{margin:0;font-size:15px;line-height:1.8;color:var(--ink-70)}

.shot{width:100%;aspect-ratio:16/9;border-radius:4px;border:1px solid var(--rule);
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 16%,transparent),rgba(22,22,26,.05));
  display:flex;align-items:center;justify-content:center;margin-bottom:12px;
  font-family:var(--mono);font-size:11px;color:var(--ink-45);letter-spacing:.1em}

.aside__box{border:1px solid var(--rule);border-radius:4px;padding:18px;margin-bottom:14px}
.aside__k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-45);margin:0 0 12px}
.meta{margin:0;font-size:14px}
.meta dt{font-family:var(--mono);font-size:11px;color:var(--ink-45);margin-top:11px}
.meta dt:first-child{margin-top:0}
.meta dd{margin:2px 0 0}
.stack{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.stack li{font-family:var(--mono);font-size:11.5px;padding:5px 11px;border-radius:999px;
  background:rgba(22,22,26,.07)}
.cta{display:flex;flex-direction:column;gap:8px}
.cta a{font-family:var(--mono);font-size:13px;text-decoration:none;text-align:center;
  padding:13px 18px;border-radius:4px;background:var(--ink);color:var(--paper);transition:.16s}
.cta a:hover{background:var(--c)}
.cta a.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.cta a.ghost:hover{background:rgba(22,22,26,.06);color:var(--ink)}

/* 이전 / 다음 */
.pager{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink)}
.pager button{padding:clamp(20px,3vw,34px) var(--pad);text-align:left;transition:background .16s;
  border-right:1px solid var(--rule)}
.pager button:last-child{border-right:0;text-align:right}
.pager button:hover{background:rgba(22,22,26,.05)}
.pager__k{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-45);display:block;margin-bottom:8px}
.pager__t{font-family:var(--display);font-size:clamp(17px,2.4vw,26px);line-height:1.2}

.foot{padding:clamp(26px,4vw,50px) var(--pad);background:var(--ink);color:var(--paper);
  display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:flex-end}
.foot__h{font-family:var(--display);font-size:clamp(20px,3vw,32px);margin:0 0 8px}
.foot a{font-family:var(--mono);font-size:14px;color:#B98511;text-decoration:none;
  border-bottom:2px solid currentColor}
.foot a:hover{color:var(--paper)}
.foot__m{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.5);text-align:right;line-height:1.9}

@media (max-width:900px){
  .band__in{grid-template-columns:34px minmax(0,1fr)}
  .band__r{grid-column:2;text-align:left;padding-top:10px}
  .band__go{display:inline;margin-left:8px}
  .d-body{grid-template-columns:1fr}
  .foot__m{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
}
</style>

var bands = document.getElementById('bands');
bands.innerHTML = P.map(function(p){
  return '<button class="band" data-slug="' + p.slug + '" data-tags="' + p.tags.join(',') + '"' +
         ' style="--c:' + p.c + '">' +
    '<span class="band__in">' +
      '<span class="band__no">' + p.no + '</span>' +
      '<span>' +
        '<span class="band__t">' + p.title + '</span>' +
        '<span class="band__repo">' + p.repo + '</span>' +
        '<span class="band__s">' + p.summary + '</span>' +
        '<span class="band__tags">' + p.tags.map(function(t){ return '<li>' + t + '</li>'; }).join('') + '</span>' +
      '</span>' +
      '<span class="band__r"><b>' + p.year + '</b>★ ' + p.stars +
        '<span class="band__go" aria-hidden="true">→</span></span>' +
    '</span></button>';
}).join('');

/* 필터 */
var chips = [].slice.call(document.querySelectorAll('.chip'));
chips.forEach(function(chip){
  chip.addEventListener('click', function(){
    chips.forEach(function(c){ c.setAttribute('aria-pressed', String(c === chip)); });
    var tag = chip.dataset.tag, n = 0;
    [].forEach.call(bands.children, function(b){
      var ok = tag === 'all' || b.dataset.tags.split(',').indexOf(tag) !== -1;
      b.classList.toggle('is-hidden', !ok);
      if (ok) n++;
    });
    document.getElementById('count').textContent = n + '개';
  });
});

/* ═══ 이동 ════════════════════════════════════ */
function route(){
  var m = location.hash.match(/^#\/p\/(.+)$/);
  if (m) {
    var i = P.findIndex(function(p){ return p.slug === m[1]; });
    if (i > -1) {
      vDet.innerHTML = detailHTML(P[i], i);
      vList.classList.remove('is-on');
      vDet.classList.add('is-on');
      window.scrollTo(0, 0);
      vDet.focus({ preventScroll:true });
      document.title = P[i].title + ' — you4ranghe';
      return;
    }
  }
  vDet.classList.remove('is-on');
  vList.classList.add('is-on');
  window.scrollTo(0, 0);
  document.title = '프로젝트 갤러리 — you4ranghe';
}
window.addEventListener('hashchange', route);

document.addEventListener('click', function(e){
  var go = e.target.closest('[data-slug]');
  if (go) { location.hash = '#/p/' + go.dataset.slug; }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && vDet.classList.contains('is-on')) location.hash = '#/';
});

route();
</script>
