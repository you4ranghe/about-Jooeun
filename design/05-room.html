<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>you4ranghe의 작업실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════
   작업실 (Room) — v4
   방 = 나라는 사람.  모니터 = 내가 만든 것.
   방은 가만히 있고, 움직이는 것은 창밖뿐.
   ═══════════════════════════════════════════════════════ */

:root{
  --wall-1:#F9E6C6; --wall-2:#EEC69C; --wall-3:#DCA87F;
  --desk-top:#D89A55; --desk-front:#AE7137; --desk-edge:#8C5828;
  --floor-1:#94603E; --floor-2:#7B4E33;
  --shade:rgba(88,52,72,.26);
  --ink:#46304F; --ink-mid:rgba(70,48,79,.72); --ink-dim:rgba(70,48,79,.44);

  --teal:#3FBFA8; --coral:#FF7A5C; --sky:#6FC3F0;
  --sun:#FFC93C;  --plum:#7B5AA6;  --cream:#FFF7EA;

  --display:"Jua","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Malgun Gothic",-apple-system,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;

  --ease:cubic-bezier(.22,.9,.24,1);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:var(--body);font-weight:300;color:var(--ink);
  background:#241A2C;overflow:hidden;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--plum);outline-offset:6px;border-radius:12px}

/* ── 카메라 · 무대 ─────────────────────────── */
.camera{position:fixed;inset:0;overflow:hidden;background:#241A2C}
.scene{
  position:relative;width:100%;height:100%;
  transform-origin:0 0;      /* 원점 고정 — 사물 사이를 옮겨도 튀지 않는다 */
  will-change:transform;
}
.layer{
  position:absolute;inset:0;pointer-events:none;   /* 클릭은 사물만 받는다 */
  transition:filter 1.1s var(--ease), opacity 1.1s var(--ease), transform 1s var(--ease);
}

.camera.is-zoomed .l-sky  {filter:blur(5px)}
.camera.is-zoomed .l-wall {filter:blur(3.5px)}
.camera.is-zoomed .l-mid  {filter:blur(2px)}
.camera.is-zoomed .l-desk {filter:blur(1px)}
.camera.is-zoomed .l-near {filter:blur(1.8px)}
.camera.is-zoomed .l-fore {filter:blur(20px);opacity:.35}
/* 화면 안으로 들어갔을 때는 책상 레이어도 흐려진다 (모니터만 선명) */
.camera.is-screen .l-desk {filter:blur(3px)}
.camera.is-screen .l-fore {opacity:0}

/* ═══ 벽 ═════════════════════════════════════ */
.wall{position:absolute;inset:0 0 30% 0;
  background:linear-gradient(168deg,var(--wall-1),var(--wall-2) 62%,var(--wall-3))}
.wall__paper{position:absolute;inset:0;opacity:.5;
  background:repeating-linear-gradient(90deg,
    rgba(255,255,255,.16) 0 3px, transparent 3px 8px,
    rgba(160,110,80,.09) 8px 10px, transparent 10px 46px)}
.wall__light{position:absolute;inset:0;transition:opacity 1.2s ease;
  background:radial-gradient(56% 76% at 76% 26%, rgba(255,236,190,.9), transparent 66%)}
.wall__bounce{position:absolute;inset:0;
  background:radial-gradient(46% 60% at 2% 62%, rgba(140,150,220,.22), transparent 70%)}

/* ═══ 창 — 유일하게 움직이는 곳 ═════════════ */
.win{position:absolute;left:55%;top:4%;width:40%;height:54%;
  border-radius:16px 16px 6px 6px;overflow:hidden;
  box-shadow:0 0 0 13px #F2D2A4, 0 0 0 17px #D6AC7C, 0 26px 54px var(--shade)}
.win__day,.win__night{position:absolute;inset:0;transition:opacity 1.4s ease}
.win__day{background:linear-gradient(180deg,#FFD79A 0%,#FFB489 34%,#FF9A96 58%,#C084B4 100%);opacity:1}
.win__night{background:linear-gradient(180deg,#141B44 0%,#252B62 42%,#3E3672 72%,#54406F 100%);opacity:0}
.win__sun{position:absolute;left:47%;top:58%;width:19%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(circle at 40% 38%,#FFFBE4,#FFE07A 62%,#FFC24A);
  box-shadow:0 0 60px 22px rgba(255,224,122,.6);transition:opacity 1.4s ease}
.win__moon{position:absolute;left:66%;top:16%;width:15%;aspect-ratio:1;border-radius:50%;opacity:0;
  background:radial-gradient(circle at 38% 34%,#FFFDF2,#EFE6C8 70%,#DCD0AC);
  box-shadow:0 0 44px 12px rgba(244,239,214,.35);transition:opacity 1.4s ease}
.win__moon::before,.win__moon::after{content:"";position:absolute;border-radius:50%;
  background:rgba(160,148,116,.28)}
.win__moon::before{left:22%;top:30%;width:26%;height:26%}
.win__moon::after{left:56%;top:56%;width:18%;height:18%}
.win__hill{position:absolute;left:-16%;right:-16%;bottom:0;height:22%;border-radius:50% 50% 0 0;
  background:#9C6EAE;opacity:.85;transition:background 1.4s ease}
.win__hill.b{left:24%;right:-34%;height:17%;background:#7E5896;opacity:.92}
.win__cloud{position:absolute;height:9%;border-radius:999px;background:rgba(255,255,255,.66);
  filter:blur(1.5px);animation:cloud linear infinite;transition:opacity 1.4s ease}
.win__cloud::after{content:"";position:absolute;left:24%;top:-56%;width:50%;height:150%;
  border-radius:50%;background:inherit}
.win__cloud::before{content:"";position:absolute;left:56%;top:-30%;width:32%;height:118%;
  border-radius:50%;background:inherit}
.win__cloud.c1{top:16%;width:38%;animation-duration:64s;animation-delay:-8s}
.win__cloud.c2{top:30%;width:26%;opacity:.62;animation-duration:47s;animation-delay:-26s}
.win__cloud.c3{top:44%;width:46%;opacity:.42;animation-duration:82s;animation-delay:-50s}
@keyframes cloud{from{left:-52%}to{left:106%}}
.win__star{position:absolute;border-radius:50%;background:#FFF9E0;opacity:0;transition:opacity 1.4s ease}
@keyframes twinkle{0%,100%{opacity:.22}50%{opacity:1}}
.win__shoot{position:absolute;left:12%;top:8%;width:26%;height:2px;opacity:0;border-radius:2px;
  background:linear-gradient(90deg,transparent,#FFF9E0);
  transform:rotate(22deg);transform-origin:left center}
@keyframes shoot{0%,88%{opacity:0;translate:0 0}90%{opacity:.95}
  97%,100%{opacity:0;translate:150px 62px}}
.win__bird{position:absolute;width:5%;opacity:0;animation:fly ease-in-out infinite;
  transition:opacity 1.4s ease}
.win__bird svg{width:100%;height:auto;display:block}
.win__bird.b1{animation-duration:26s}
.win__bird.b2{animation-duration:34s;animation-delay:-15s;width:3.4%}
@keyframes fly{0%,58%{left:-8%;top:24%;opacity:0}62%{opacity:.8}
  86%{left:100%;top:11%;opacity:.8}90%,100%{left:104%;opacity:0}}
.win__bar-v{position:absolute;top:0;bottom:0;width:10px;margin-left:-5px;background:#F2D2A4;
  box-shadow:2px 0 6px rgba(0,0,0,.14)}
.win__bar-v.a{left:33.4%}
.win__bar-v.b{left:66.7%}
.win__bar-h{position:absolute;top:50%;left:0;right:0;height:10px;margin-top:-5px;background:#F2D2A4;
  box-shadow:0 2px 6px rgba(0,0,0,.14)}
.win__glass{position:absolute;inset:0;
  background:linear-gradient(122deg,rgba(255,255,255,.26) 0 20%,transparent 38%,
                                     rgba(255,255,255,.12) 54%,transparent 68%)}
.win__sill{position:absolute;left:53%;top:57.5%;width:44%;height:2.2%;border-radius:4px;
  background:linear-gradient(180deg,#F6DCB2,#D6AC7C);box-shadow:0 10px 22px var(--shade)}
.curtain{position:absolute;left:51%;top:1.5%;width:7.5%;height:58%;
  background:linear-gradient(96deg,#E4859A,#C96A85 60%,#A85572);
  border-radius:0 0 42% 12%;box-shadow:5px 12px 30px var(--shade)}
.curtain::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(94deg,rgba(255,255,255,.15) 0 5px,transparent 5px 18px)}
.rays{position:absolute;left:46%;top:5%;width:50%;height:76%;filter:blur(4px);
  mix-blend-mode:screen;transition:opacity 1.4s ease;
  background:linear-gradient(200deg,
    rgba(255,242,198,.46) 0 5%, transparent 5% 12%,
    rgba(255,242,198,.28) 12% 17%, transparent 17% 28%,
    rgba(255,242,198,.18) 28% 32%, transparent 32%)}

/* ═══ 벽 장식 ════════════════════════════════ */
.clock{position:absolute;left:20.5%;top:5%;width:6.2%;aspect-ratio:1;border-radius:50%;
  background:#FFF7EA;box-shadow:inset 0 0 0 6px #46304F, 0 12px 24px var(--shade)}
.clock i{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;background:#46304F;border-radius:2px}
.clock .h{width:3px;margin-left:-1.5px;height:26%;transform:rotate(-55deg)}
.clock .m{width:2.5px;margin-left:-1.25px;height:36%;transform:rotate(60deg)}
.clock::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;
  border-radius:50%;background:var(--coral)}
.cork{position:absolute;left:31%;top:4%;width:15%;height:19%;border-radius:7px;
  background:#DCB37D;box-shadow:inset 0 0 0 7px #A8744A, 0 14px 28px var(--shade)}
.cork::after{content:"";position:absolute;inset:10px;border-radius:3px;opacity:.5;
  background:radial-gradient(circle at 30% 30%, rgba(90,60,30,.16) 0 1.6px, transparent 1.7px) 0 0/11px 11px}

/* ═══ 선반 · 책상 ════════════════════════════ */
.shelf{position:absolute;left:6%;top:28%;width:44%;height:15px;border-radius:5px;
  background:linear-gradient(180deg,#DCA86F,#B8814B 60%,#96632F);box-shadow:0 14px 30px var(--shade)}
.shelf::before{content:"";position:absolute;left:0;right:0;top:-2px;height:2px;background:rgba(255,255,255,.4)}
.shelf__brace{position:absolute;top:100%;width:11px;height:22px;background:#96632F;border-radius:0 0 3px 3px}
.shelf__brace.a{left:9%}
.shelf__brace.b{right:9%}

.desk{position:absolute;left:3%;right:3%;top:61%;height:10%;border-radius:10px 10px 5px 5px;
  background:linear-gradient(180deg,#E2A960 0 8%, var(--desk-top) 8% 44%, var(--desk-front) 44%, var(--desk-edge));
  box-shadow:0 26px 50px var(--shade)}
.desk__grain{position:absolute;left:0;right:0;top:0;height:44%;opacity:.3;
  background:repeating-linear-gradient(90deg,rgba(120,70,30,.18) 0 1px,transparent 1px 34px)}
.desk__pool{position:absolute;left:40%;right:2%;top:-2%;height:46%;border-radius:50%;
  transition:opacity 1.4s ease;
  background:radial-gradient(ellipse,rgba(255,240,196,.62),transparent 72%)}
.desk__leg{position:absolute;top:100%;width:16px;height:15vh;border-radius:0 0 5px 5px;
  background:linear-gradient(90deg,#AE7137,#8C5828)}
.desk__leg.l{left:6%}
.desk__leg.r{right:6%}
.mat{position:absolute;left:22%;top:60.6%;width:44%;height:3.2%;border-radius:6px;
  background:#5C4569;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.keyboard{position:absolute;left:34%;top:61.2%;width:21%;height:2.4%;border-radius:4px;
  background:linear-gradient(180deg,#F3E7D6,#D6C4B0);box-shadow:0 3px 8px rgba(0,0,0,.22)}
.keyboard::after{content:"";position:absolute;inset:3px 5px;border-radius:2px;opacity:.55;
  background:repeating-linear-gradient(90deg,#B9A691 0 3px,transparent 3px 8px)}
.mouse{position:absolute;left:57.5%;top:61.1%;width:2.4%;height:2.6%;border-radius:50% 50% 44% 44%;
  background:linear-gradient(160deg,#F3E7D6,#CBB9A4);box-shadow:0 3px 8px rgba(0,0,0,.22)}
.papers{position:absolute;left:76%;top:59.4%;width:9%;height:3%}
.papers i{position:absolute;inset:0;background:#FFF7EA;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.16)}
.papers i:nth-child(1){transform:rotate(-4deg)}
.papers i:nth-child(2){transform:rotate(3deg) translateY(-2px)}
.papers i:nth-child(3){transform:rotate(-1deg) translateY(-4px)}
.lamp{position:absolute;left:6.5%;top:44%;width:9%}
.lamp svg{width:100%;height:auto;display:block}
.lamp__glow{position:absolute;left:-70%;top:60%;width:240%;aspect-ratio:1;border-radius:50%;opacity:0;
  transition:opacity 1.4s ease;
  background:radial-gradient(circle,rgba(255,214,140,.72),transparent 66%)}
.prop{position:absolute}
.prop svg{width:100%;height:auto;display:block;filter:drop-shadow(-4px 6px 8px rgba(88,52,72,.28))}

/* ═══ 바닥 ═══════════════════════════════════ */
.floor{position:absolute;left:0;right:0;bottom:0;height:30%;
  background:linear-gradient(180deg,var(--floor-1),var(--floor-2))}
.floor::before{content:"";position:absolute;inset:0;opacity:.55;
  background:repeating-linear-gradient(97deg,rgba(0,0,0,.09) 0 2px,transparent 2px 88px)}
.baseboard{position:absolute;left:0;right:0;top:0;height:14px;background:#C39468;
  box-shadow:0 5px 14px var(--shade)}
.rug{position:absolute;left:12%;right:16%;bottom:2%;height:17%;border-radius:50%;opacity:.92;
  background:radial-gradient(ellipse,#C9788B 0 42%, #A85F76 42% 62%, #8E4E64 62%);
  box-shadow:0 -6px 22px rgba(0,0,0,.12)}
.rug::after{content:"";position:absolute;inset:14% 10%;border-radius:50%;
  border:3px dashed rgba(255,247,234,.32)}
.strip{position:absolute;left:76%;bottom:9%;width:8%;height:2.2%;border-radius:4px;background:#3E2E48}
.strip i{position:absolute;top:50%;width:4px;height:4px;margin-top:-2px;border-radius:50%;
  background:var(--teal);opacity:.9}
.strip i:nth-child(1){left:16%}
.strip i:nth-child(2){left:44%;background:var(--sun)}
.strip i:nth-child(3){left:72%;background:var(--coral)}

/* ═══ 전경 ═══════════════════════════════════ */
.l-fore{filter:blur(7px);opacity:.9}
.frond{position:absolute;bottom:-6%;width:25%}
.frond.left{left:-6%;transform:rotate(-8deg)}
.frond.right{right:-7%;transform:scaleX(-1) rotate(-11deg)}
.frond svg{width:100%;height:auto;display:block}

/* ═══ 사물 — 움직이지 않는다 ════════════════ */
.thing{position:absolute;cursor:pointer;pointer-events:auto;
  transition:scale .3s var(--ease), rotate .3s var(--ease),
             opacity .5s var(--ease) var(--bd,0s), filter .55s}
.thing svg{display:block;width:100%;height:auto;overflow:visible;position:relative;z-index:1;
  filter:drop-shadow(-6px 8px 7px rgba(88,52,72,.3))}
.thing::after{content:"";position:absolute;left:50%;bottom:-8%;width:82%;height:15%;z-index:0;
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(ellipse,rgba(88,52,72,.42),transparent 72%)}
.thing::before{content:"";position:absolute;left:50%;top:46%;width:148%;aspect-ratio:1;z-index:0;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:.55;
  transition:opacity .4s ease, background 1.4s ease;
  background:radial-gradient(circle,rgba(255,246,214,.62) 0 25%,
                                     rgba(255,246,214,.2) 45%, transparent 66%)}
.thing.is-seen::before{opacity:0}
.thing:hover,.thing:focus-visible{scale:1.1;rotate:-1.8deg}
.thing:hover::before,.thing:focus-visible::before{opacity:.85}
.thing:active{scale:.97}

.thing .tip{position:absolute;left:50%;bottom:calc(100% + 14px);translate:-50% 8px;z-index:3;
  background:var(--ink);color:var(--cream);white-space:nowrap;
  font-family:var(--mono);font-size:11px;padding:7px 13px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s, translate .2s;
  box-shadow:0 10px 20px rgba(0,0,0,.3)}
.thing .tip::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;
  border:5px solid transparent;border-top-color:var(--ink)}
.thing:hover .tip,.thing:focus-visible .tip{opacity:1;translate:-50% 0}

.camera.is-zoomed .thing:not(.is-active){opacity:.26;filter:blur(2.5px)}
.thing.is-active{animation:pop .5s cubic-bezier(.34,1.02,.3,1)}
.thing.is-active::before{opacity:0}
@keyframes pop{0%{scale:1}36%{scale:1.14}100%{scale:1}}

/* ── 밤이 되면 물건들이 깨어난다 ───────────── */
.face{opacity:0;transition:opacity 1.3s ease}
body.is-night .face{opacity:1}

/* ═══ 모니터 — 갤러리로 들어가는 문 ═════════ */
.mon{position:absolute;left:38.5%;top:40%;width:20%;pointer-events:auto;
  transition:scale .3s var(--ease), filter .55s, opacity .5s var(--ease) var(--bd,0s)}
.mon__bezel{
  display:block;position:relative;padding:4.6%;border-radius:11px;
  background:linear-gradient(168deg,#5B4268,#3A2846);
  box-shadow:-8px 10px 16px rgba(88,52,72,.36), inset 0 1px 0 rgba(255,255,255,.14);
}
.mon__screen{
  display:block;position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:4px;
  background:#F6F6F3;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4);
}
.mon__screen iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;pointer-events:none;
  background:#F6F6F3}
.mon__glare{position:absolute;inset:0;pointer-events:none;transition:opacity .8s ease;
  background:linear-gradient(126deg,rgba(255,255,255,.3) 0 22%,transparent 42%,
                                     rgba(255,255,255,.1) 58%,transparent 72%)}
.mon__neck{position:absolute;left:50%;top:100%;width:11%;height:16%;margin-left:-5.5%;
  background:linear-gradient(90deg,#5B4268,#3A2846)}
.mon__foot{position:absolute;left:50%;top:116%;width:38%;height:5%;margin-left:-19%;
  border-radius:0 0 6px 6px;background:linear-gradient(180deg,#5B4268,#2E1F38);
  box-shadow:-6px 8px 14px rgba(88,52,72,.34)}
.mon__hit{position:absolute;inset:-4%;cursor:pointer;z-index:4;border-radius:14px}
.mon__glow{position:absolute;left:50%;top:48%;width:150%;aspect-ratio:1.4;z-index:0;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;opacity:.6;
  transition:opacity .4s ease;
  background:radial-gradient(ellipse,rgba(140,205,255,.55) 0 26%,rgba(140,205,255,.16) 48%,transparent 68%)}
.mon.is-seen .mon__glow{opacity:0}
.mon:hover{scale:1.05}
.mon:hover .mon__glow{opacity:.85}
.mon .tip{position:absolute;left:50%;bottom:calc(100% + 14px);translate:-50% 8px;z-index:5;
  background:var(--ink);color:var(--cream);white-space:nowrap;
  font-family:var(--mono);font-size:11px;padding:7px 13px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s, translate .2s;
  box-shadow:0 10px 20px rgba(0,0,0,.3)}
.mon .tip::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;
  border:5px solid transparent;border-top-color:var(--ink)}
.mon:hover .tip{opacity:1;translate:-50% 0}
.camera.is-zoomed .mon:not(.is-focus){opacity:.26;filter:blur(2.5px)}

/* 화면 안으로 들어간 상태 */
.camera.is-screen .mon{scale:1}
.camera.is-screen .mon__hit{display:none}
.camera.is-screen .mon__screen iframe{pointer-events:auto}
.camera.is-screen .mon__glare{opacity:0}
.camera.is-screen .mon__glow{opacity:0}
.camera.is-screen .mon .tip{display:none}

/* 화면 모드 상단 바 */
.screenbar{
  position:fixed;left:0;right:0;top:0;z-index:45;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px clamp(14px,2.4vw,28px);
  background:linear-gradient(180deg,rgba(36,26,44,.92),rgba(36,26,44,0));
  translate:0 -100%;opacity:0;transition:translate .6s var(--ease), opacity .5s ease;
  pointer-events:none;
}
.camera.is-screen ~ .screenbar{translate:0 0;opacity:1;pointer-events:auto}
.screenbar__back{
  display:inline-flex;align-items:center;gap:9px;cursor:pointer;
  background:rgba(255,247,234,.92);border-radius:999px;padding:11px 19px;
  font-family:var(--mono);font-size:12.5px;color:var(--ink);
  box-shadow:0 12px 30px rgba(0,0,0,.3);transition:background .16s, transform .16s;
}
.screenbar__back:hover{background:#fff;transform:translateX(-3px)}
.screenbar__note{font-family:var(--mono);font-size:11px;color:rgba(255,247,234,.6)}

/* ── 밤 ────────────────────────────────────── */
.nightwash{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:0;
  mix-blend-mode:multiply;transition:opacity 1.4s ease;
  background:linear-gradient(180deg,rgba(38,34,86,.6),rgba(26,22,58,.7))}
.camera.is-night .nightwash{opacity:1}
.camera.is-night .wall__light{opacity:.06}
.camera.is-night .desk__pool{opacity:.08}
.camera.is-night .rays{opacity:0}
.camera.is-night .win__day{opacity:0}
.camera.is-night .win__night{opacity:1}
.camera.is-night .win__sun{opacity:0}
.camera.is-night .win__moon{opacity:1}

.vignette{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:.7;

.camera.boot .l-sky,.camera.boot .l-wall{opacity:0}

.camera.boot .l-desk{opacity:0;transform:translateY(22px)}
.camera.boot .l-near{opacity:0;transform:translateY(28px)}

.camera.boot .thing,.camera.boot .mon{opacity:0}

/* ── HUD ───────────────────────────────────── */
.hud{position:fixed;z-index:30;left:0;right:0;top:0;pointer-events:none;

.guide__dot{width:7px;height:7px;border-radius:50%;background:var(--sun)}

/* ── 상세 카드 (이력서) ────────────────────── */
.card{position:fixed;z-index:40;right:0;top:0;height:100%;width:min(440px,42vw);
  background:rgba(255,247,234,.96);backdrop-filter:blur(16px);
  box-shadow:-26px 0 64px rgba(88,52,72,.32);

  translate:105% 0;transition:translate .8s cubic-bezier(.34,1.02,.3,1);
  display:flex;flex-direction:column;gap:12px}
.card.is-open{translate:0 0}
.card > *{opacity:0;translate:0 12px;transition:opacity .45s var(--ease), translate .45s var(--ease)}
.card.is-open > *{opacity:1;translate:0 0}
.card.is-open > *:nth-child(2){transition-delay:.12s}
.card.is-open > *:nth-child(3){transition-delay:.17s}
.card.is-open > *:nth-child(4){transition-delay:.21s}
.card.is-open > *:nth-child(5){transition-delay:.25s}
.card.is-open > *:nth-child(6){transition-delay:.29s}
.card.is-open > *:nth-child(7){transition-delay:.33s}
.card.is-open > *:nth-child(8){transition-delay:.37s}
.card.is-open.is-swapping > *{opacity:0;translate:0 -8px;transition-delay:0s;transition-duration:.26s}

.card__obj{width:100px;height:100px;display:flex;align-items:center;justify-content:center;

.card__h{font-family:var(--display);font-size:clamp(23px,3vw,31px);margin:0;line-height:1.24}
.card__lead{margin:0;font-size:15px;line-height:1.7;color:var(--ink)}

.card__body p:last-child{margin-bottom:0}
.card__body strong{font-weight:500;color:var(--ink)}
.card__rows{margin:0;font-size:14px}

.card__nav{display:flex;gap:8px}

.card__nav button:hover{background:rgba(70,48,79,.08)}
.card__links{display:flex;gap:9px;flex-wrap:wrap;margin-top:auto;padding-top:16px}
.card__links a{font-family:var(--mono);font-size:12.5px;text-decoration:none;

.card__links a:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(123,90,166,.4)}

  opacity:1!important;translate:0!important}
.card__close:hover{background:var(--plum);color:var(--cream)}

/* ── 목록 ──────────────────────────────────── */
.list{position:fixed;inset:0;z-index:50;background:rgba(36,26,44,.92);backdrop-filter:blur(10px);

.list__gal{width:100%;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;

.list__close{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;
  color:var(--cream);font-size:22px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,247,234,.3)}

@media (max-width:860px){

@media (prefers-reduced-motion:reduce){

}

/* ═══ 배치 ════════════════════════════════════ */
var camera = document.getElementById('camera');
var scene  = document.getElementById('scene');
var things = document.getElementById('things');
var mon    = document.getElementById('mon');
var frame  = document.getElementById('monFrame');
var screenEl = mon.querySelector('.mon__screen');

DATA.forEach(function(d, i){
  var b = document.createElement('button');
  b.className = 'thing';
  b.type = 'button';
  b.dataset.i = i;
  b.style.cssText = 'left:' + d.x + ';top:' + d.y + ';width:' + d.w +
                    ';--bd:' + (0.3 + i * 0.05).toFixed(2) + 's';
  b.setAttribute('aria-label', d.cat + ' — ' + d.name);
  b.innerHTML = ART[d.art] + '<span class="tip">' + d.tip + '</span>';
  things.appendChild(b);
});

/* 별 */

  st.className = 'win__star';

  st.style.cssText = 'left:' + (3 + Math.random()*94) + '%;top:' + (3 + Math.random()*62) + '%;' +
                     'width:' + sz + 'px;height:' + sz + 'px;' +
                     'animation-duration:' + (2.6 + Math.random()*3.4).toFixed(1) + 's;' +
                     'animation-delay:' + (Math.random()*4).toFixed(1) + 's';

/* ═══ 모니터 화면 크기 맞추기 ══════════════════
   화면 안으로 들어갔을 때 갤러리가 1:1 크기로 보이도록,
   iframe 을 (화면크기 × 줌배율) 로 만들고 그만큼 축소해 둔다.
   ═══════════════════════════════════════════ */
var MON = { s:1, w:0, h:0 };
function fitMonitor(){
  var w = screenEl.offsetWidth, h = screenEl.offsetHeight;
  if (!w || !h) return;
  var vw = window.innerWidth, vh = window.innerHeight;
  var s = Math.min(vw * 0.86 / w, (vh - 90) * 0.94 / h);
  s = Math.max(1.6, Math.min(s, 9));
  MON = { s:s, w:w, h:h };
  frame.style.width  = Math.round(w * s) + 'px';
  frame.style.height = Math.round(h * s) + 'px';
  frame.style.transform = 'scale(' + (1 / s) + ')';
}
window.addEventListener('load', fitMonitor);
setTimeout(fitMonitor, 400);

/* ═══ 카메라 ══════════════════════════════════ */
var card = document.getElementById('card');
var current = -1, seen = {}, seenN = 0, done = false, inScreen = false;
var camAnim = null, lastShot = null;
var REDUCE = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var EASE = 'cubic-bezier(.48,.02,.2,1)';

/* scene 기준 중심 좌표 (transform 영향 없는 레이아웃 값) */
function centerIn(el){
  var x = 0, y = 0, n = el;
  while (n && n !== scene) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return { x:x + el.offsetWidth / 2, y:y + el.offsetHeight / 2 };
}
function shotFor(el, aimRX, aimRY, sc){
  var W = scene.offsetWidth, H = scene.offsetHeight;
  var c = centerIn(el);
  var aimX = W * aimRX, aimY = H * aimRY;
  return { ox:c.x, oy:c.y, s:sc, aimX:aimX, aimY:aimY, tx:aimX - c.x*sc, ty:aimY - c.y*sc };
}
function toCss(sh){
  return 'translate(' + sh.tx.toFixed(2) + 'px,' + sh.ty.toFixed(2) + 'px) scale(' + sh.s.toFixed(4) + ')';
}
function nowCss(){
  var t = getComputedStyle(scene).transform;
  return (!t || t === 'none') ? 'translate(0px,0px) scale(1)' : t;
}
function moveCamera(target, via, dur){
  var from = nowCss();
  if (camAnim) { camAnim.cancel(); camAnim = null; }
  if (REDUCE || dur === 0) { scene.style.transform = target; return; }
  var frames = via
    ? [{ transform:from }, { transform:via, offset:.5 }, { transform:target }]
    : [{ transform:from }, { transform:target }];
  camAnim = scene.animate(frames, { duration:dur, easing:EASE, fill:'forwards' });
  camAnim.onfinish = function(){
    scene.style.transform = target;
    if (camAnim) { camAnim.cancel(); camAnim = null; }
  };
}

/* ── 카드 채우기 ───────────────────────────── */
function fillCard(d){
  document.getElementById('c-obj').innerHTML   = ART[d.art];
  document.getElementById('c-cat').textContent = d.cat;
  document.getElementById('c-h').textContent   = d.name;
  document.getElementById('c-lead').textContent = d.lead || '';

  var extra = '';
  if (d.rows) {
    extra += '<dl class="card__rows">' + d.rows.map(function(r){
      return '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>';
    }).join('') + '</dl>';
  }
  if (d.chips) {
    extra += '<ul class="card__chips">' + d.chips.map(function(c){
      return '<li class="' + (c[1] || '') + '">' + c[0] + '</li>';
    }).join('') + '</ul>';
  }
  document.getElementById('c-extra').innerHTML = extra;
  document.getElementById('c-body').innerHTML  =
    (d.body || []).map(function(p){ return '<p>' + p + '</p>'; }).join('');
  document.getElementById('c-links').innerHTML =
    (d.links || []).map(function(l){
      return '<a class="' + (l[2] || '') + '" href="' + l[0] + '"' +
             (/^https?:/.test(l[0]) ? ' target="_blank" rel="noopener"' : '') + '>' + l[1] + '</a>';
    }).join('');
}

/* ── 사물로 들어가기 ───────────────────────── */
function zoomTo(i, instant){
  if (inScreen) exitScreen(true);
  var d   = DATA[i];
  var btn = things.querySelector('.thing[data-i="' + i + '"]');
  if (!btn) return;

  var wide = window.innerWidth > 860;
  var shot = shotFor(btn, wide ? 0.29 : 0.50, wide ? 0.46 : 0.29, wide ? 2.4 : 1.9);
  var switching = (current !== -1 && current !== i && camera.classList.contains('is-zoomed'));

  var via = null, dur = 950;
  if (switching && lastShot) {
    var midS = Math.max(1.12, Math.min(lastShot.s, shot.s) * 0.5);
    var mox = (lastShot.ox + shot.ox) / 2, moy = (lastShot.oy + shot.oy) / 2;
    via = 'translate(' + (shot.aimX - mox*midS).toFixed(2) + 'px,' +
                         (shot.aimY - moy*midS).toFixed(2) + 'px) scale(' + midS.toFixed(4) + ')';
    var gap = Math.hypot(shot.ox - lastShot.ox, shot.oy - lastShot.oy) / scene.offsetWidth;
    dur = 1000 + Math.min(gap, 1) * 500;
  }

  moveCamera(toCss(shot), via, instant ? 0 : dur);
  lastShot = shot;
  camera.classList.add('is-zoomed');
  mon.classList.remove('is-focus');

  [].forEach.call(things.querySelectorAll('.thing'), function(t){ t.classList.remove('is-active'); });
  void btn.offsetWidth;
  btn.classList.add('is-active','is-seen');

  if (!seen[i]) {
    seen[i] = 1; seenN++;
    document.getElementById('seen').textContent = seenN;
    document.getElementById('bar').style.width = (seenN / DATA.length * 100) + '%';
    if (seenN === DATA.length && !done) { done = true; }
  }

  if (switching && !instant && !REDUCE) {
    card.classList.add('is-swapping');
    clearTimeout(zoomTo._t);
    zoomTo._t = setTimeout(function(){
      fillCard(d); card.classList.remove('is-swapping');
    }, Math.round(dur * 0.42));
  } else {
    fillCard(d); card.classList.remove('is-swapping');
  }

  card.classList.add('is-open');
  document.getElementById('guide').classList.add('is-gone');
  current = i;
}

/* ── 모니터 화면 안으로 ────────────────────── */
function enterScreen(instant){
  fitMonitor();
  card.classList.remove('is-open','is-swapping');
  [].forEach.call(things.querySelectorAll('.thing'), function(t){ t.classList.remove('is-active'); });

  var shot = shotFor(screenEl, 0.5, 0.53, MON.s);
  /* 화면으로 들어갈 때는 살짝 물러섰다가 빨려 들어간다 */
  var via = null;
  if (!instant && !REDUCE) {
    var midS = Math.max(1.05, MON.s * 0.32);
    via = 'translate(' + (shot.aimX - shot.ox*midS).toFixed(2) + 'px,' +
                         (shot.aimY - shot.oy*midS).toFixed(2) + 'px) scale(' + midS.toFixed(4) + ')';
  }
  moveCamera(toCss(shot), via, instant ? 0 : 1250);
  lastShot = shot;

  camera.classList.add('is-zoomed','is-screen');
  mon.classList.add('is-focus','is-seen');
  document.getElementById('guide').classList.add('is-gone');
  inScreen = true; current = -1;
  setTimeout(function(){ document.getElementById('screenBack').focus({ preventScroll:true }); }, 900);
}

function exitScreen(silent){
  camera.classList.remove('is-screen');
  mon.classList.remove('is-focus');
  inScreen = false;
  if (!silent) {
    moveCamera('translate(0px,0px) scale(1)', null, 900);
    camera.classList.remove('is-zoomed');
    lastShot = null;
    document.getElementById('monHit').focus({ preventScroll:true });
  }
}

function reset(){
  if (inScreen) { exitScreen(); return; }
  moveCamera('translate(0px,0px) scale(1)', null, 820);
  lastShot = null;
  camera.classList.remove('is-zoomed');
  card.classList.remove('is-open','is-swapping');
  [].forEach.call(things.querySelectorAll('.thing'), function(t){ t.classList.remove('is-active'); });
  if (current > -1) {
    var b = things.querySelector('.thing[data-i="' + current + '"]');
    if (b) b.focus({ preventScroll:true });
  }
  current = -1;
}

/* ═══ 이벤트 ══════════════════════════════════ */
document.addEventListener('click', function(e){
  if (e.target.closest('#monHit')) { enterScreen(); return; }
  if (e.target.closest('#screenBack')) { exitScreen(); return; }

  var thing = e.target.closest('.thing');
  if (thing) { zoomTo(+thing.dataset.i); return; }
  if (e.target.closest('#cardClose')) { reset(); return; }

  var step = e.target.closest('[data-step]');
  if (step) { zoomTo((current + (+step.dataset.step) + DATA.length) % DATA.length); return; }

  if (camera.classList.contains('is-zoomed') && !inScreen &&
      !e.target.closest('.card') && !e.target.closest('.hud') && !e.target.closest('.mon')) reset();
});

document.addEventListener('keydown', function(e){
  if (e.key === 'Escape') {
    if (document.getElementById('list').classList.contains('is-open')) { closeList(); return; }
    reset(); return;
  }
  if (inScreen || !camera.classList.contains('is-zoomed')) return;
  if (e.key === 'ArrowRight') zoomTo((current + 1) % DATA.length);
  if (e.key === 'ArrowLeft')  zoomTo((current - 1 + DATA.length) % DATA.length);
});

window.addEventListener('resize', function(){
  fitMonitor();
  if (inScreen) enterScreen(true);
  else if (current > -1) zoomTo(current, true);
});

/* ═══ 밤/낮 ═══════════════════════════════════ */
document.getElementById('toggleNight').addEventListener('click', function(){
  var night = camera.classList.toggle('is-night');
  document.body.classList.toggle('is-night', night);
  this.textContent = night ? '☀️' : '🌙';
  this.setAttribute('aria-label', night ? '낮으로 바꾸기' : '밤으로 바꾸기');
  this.title = night ? '낮으로 되돌리기' : '밤으로 — 물건들이 깨어납니다';
});

/* ═══ 목록 ════════════════════════════════════ */

document.getElementById('listRows').innerHTML = DATA.map(function(d, i){
  return '<li><button class="row" data-go="' + i + '">' +
           '<span class="row__o">' + ART[d.art] + '</span>' +

           '<span class="row__s">' + d.cat.split(' · ')[1] + '</span>' +
         '</button></li>';
}).join('');

function closeList(){ list.classList.remove('is-open'); }
document.getElementById('openList').addEventListener('click', function(){ list.classList.add('is-open'); });
document.getElementById('listClose').addEventListener('click', closeList);
document.getElementById('listGal').addEventListener('click', function(){ closeList(); enterScreen(); });
list.addEventListener('click', function(e){
  if (e.target === list) { closeList(); return; }
  var row = e.target.closest('[data-go]');
  if (row) { closeList(); zoomTo(+row.dataset.go); }
});

/* ═══ 등장 ════════════════════════════════════ */
function bootDone(){
  if (!camera.classList.contains('boot')) return;
  camera.classList.remove('boot');
  fitMonitor();
  setTimeout(function(){
    [].forEach.call(things.children, function(t){ t.style.setProperty('--bd','0s'); });
  }, 1300);
}
window.addEventListener('load', function(){ setTimeout(bootDone, 100); });
setTimeout(bootDone, 1500);

document.addEventListener('click', function once(){
  document.getElementById('guide').classList.add('is-gone');
  document.removeEventListener('click', once);
});
