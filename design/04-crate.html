<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시안 D · 레코드 진열대(Crate) — you4ranghe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────
   시안 D — 레코드 진열대 (Crate)
   3층 선반이 따로 흐른다. 한 장을 뽑으면 판이 돌아간다.
   ───────────────────────────────────────────── */

:root{
  --night:#1B1626;
  --night-2:#241D33;
  --lamp:#FFB86B;
  --wood:#7A4F35;
  --wood-hi:#A67049;
  --wood-lo:#4A2E1E;
  --cream:#F3E9DC;
  --cream-dim:rgba(243,233,220,.6);
  --cream-faint:rgba(243,233,220,.34);

  --display:"Do Hyeon","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Malgun Gothic",-apple-system,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;

  --lp:184px;              /* 슬리브 한 변 */
  --ease:cubic-bezier(.22,.9,.24,1);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--night);color:var(--cream);
  font-family:var(--body);font-weight:300;line-height:1.65;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
/* 가게 안 램프빛 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(255,184,107,.20), transparent 60%),
    radial-gradient(90% 60% at 12% 110%, rgba(139,107,255,.16), transparent 65%);
}
main,header{position:relative;z-index:1}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lamp);outline-offset:4px;border-radius:6px}

/* ── 머리 ──────────────────────────────────── */
.top{
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  padding:clamp(26px,4vw,48px) clamp(20px,4vw,54px) clamp(14px,2vw,22px);
}
.top__brand{display:flex;align-items:baseline;gap:14px}
.top__h{
  font-family:var(--display);font-size:clamp(26px,4vw,46px);
  margin:0;letter-spacing:.01em;line-height:1;
}
.top__h span{color:var(--lamp)}
.top__sub{font-family:var(--mono);font-size:12px;color:var(--cream-faint)}
.top__note{font-size:14px;color:var(--cream-dim);max-width:36ch;margin:0}
.top__links{display:flex;gap:16px;font-family:var(--mono);font-size:12.5px}
.top__links a{color:var(--cream-dim);text-decoration:none}
.top__links a:hover{color:var(--lamp)}

.hint{
  display:flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:11.5px;color:var(--cream-faint);
  padding:0 clamp(20px,4vw,54px) 10px;
}
.hint i{
  width:24px;height:1px;background:currentColor;display:block;
  animation:swipe 2.6s var(--ease) infinite;transform-origin:left;
}
@keyframes swipe{0%,100%{transform:scaleX(.3)}50%{transform:scaleX(1)}}

/* ── 선반 ──────────────────────────────────── */
.racks{padding-bottom:clamp(40px,7vw,90px)}
.shelf{margin-bottom:clamp(26px,3.6vw,46px);position:relative}
.shelf__tag{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--cream-faint);padding:0 clamp(20px,4vw,54px) 9px;
}
.crate{
  display:flex;gap:18px;overflow-x:auto;overflow-y:visible;
  padding:26px clamp(20px,4vw,54px) 0;
  scrollbar-width:none;cursor:grab;
  scroll-snap-type:x proximity;
}
.crate::-webkit-scrollbar{display:none}
.crate.is-dragging{cursor:grabbing;scroll-snap-type:none}
.crate.is-dragging *{pointer-events:none}

/* 나무 선반 판 */
.shelf__board{
  height:16px;margin:0 clamp(12px,3vw,38px);border-radius:0 0 8px 8px;
  background:linear-gradient(180deg,var(--wood-hi),var(--wood) 42%,var(--wood-lo));
  box-shadow:0 16px 34px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.16);
  position:relative;z-index:3;
}

/* ── LP 슬리브 ─────────────────────────────── */
.lp{
  flex:0 0 var(--lp);width:var(--lp);height:var(--lp);
  position:relative;border:0;padding:0;background:none;cursor:pointer;
  scroll-snap-align:center;
  transition:transform .34s var(--ease), filter .34s var(--ease);
  transform-origin:bottom center;
}
.lp:hover,.lp:focus-visible{transform:translateY(-26px) rotate(-1.2deg)}
.lp:hover .sleeve,.lp:focus-visible .sleeve{box-shadow:0 26px 46px rgba(0,0,0,.6)}
.lp:hover .peek,.lp:focus-visible .peek{transform:translate(28px,-8px) rotate(6deg)}

/* 슬리브 뒤로 살짝 보이는 판 */
.peek{
  position:absolute;inset:6px 6px 6px 6px;border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, #2A2730 0 16%, transparent 16.4%),
    repeating-radial-gradient(circle at 50% 50%, #0F0E13 0 2px, #17161C 2px 4px);
  box-shadow:0 10px 26px rgba(0,0,0,.5);
  transition:transform .38s var(--ease);
  z-index:0;
}
.peek::after{
  content:"";position:absolute;inset:38%;border-radius:50%;
  background:var(--lpc,#FF6B5A);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.25);
}

.sleeve{
  position:absolute;inset:0;border-radius:4px;overflow:hidden;z-index:1;
  box-shadow:0 14px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.08);
  background:var(--bg1,#2B2536);
  transition:box-shadow .34s var(--ease);
}
/* 슬리브 표지 — 패턴 6종 */
.sleeve[data-art="rings"]::before{
  content:"";position:absolute;inset:0;
  background:repeating-radial-gradient(circle at 50% 55%, var(--c1) 0 9px, var(--bg1) 9px 20px);
  opacity:.95;
}
.sleeve[data-art="bars"]::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(115deg, var(--c1) 0 14px, var(--bg1) 14px 30px);
}
.sleeve[data-art="arc"]::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 18% 92%, var(--c1) 0 46%, transparent 46.5%),
    radial-gradient(circle at 88% 16%, var(--c2) 0 30%, transparent 30.5%),
    var(--bg1);
}
.sleeve[data-art="grid"]::before{
  content:"";position:absolute;inset:0;
  background:
    repeating-linear-gradient(0deg, var(--c1) 0 2px, transparent 2px 22px),
    repeating-linear-gradient(90deg, var(--c1) 0 2px, transparent 2px 22px),
    linear-gradient(160deg, var(--c2), var(--bg1));
}
.sleeve[data-art="wave"]::before{
  content:"";position:absolute;inset:0;
  background:conic-gradient(from 210deg at 34% 68%, var(--c1), var(--c2), var(--bg1), var(--c1));
}
.sleeve[data-art="split"]::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(118deg, var(--c1) 0 46%, var(--c2) 46% 62%, var(--bg1) 62%);
}
.sleeve::after{ /* 종이 질감 + 상단 광택 */
  content:"";position:absolute;inset:0;
  background:linear-gradient(200deg, rgba(255,255,255,.14), transparent 42%);
  mix-blend-mode:screen;
}

.sleeve__txt{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:12px 13px;text-align:left;
  background:linear-gradient(0deg, rgba(12,10,16,.86), rgba(12,10,16,.5) 62%, transparent);
}
.sleeve__cat{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  color:rgba(243,233,220,.62);display:block;margin-bottom:3px;
}
.sleeve__name{
  font-family:var(--display);font-size:17px;line-height:1.2;display:block;
  color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);
}
.lp.is-hidden{display:none}

/* ── 뷰어 (줌인) ───────────────────────────── */
.viewer{
  position:fixed;inset:0;z-index:100;display:none;
  padding:clamp(16px,4vw,60px);
}
.viewer.is-open{display:block}
.viewer__veil{
  position:absolute;inset:0;
  background:radial-gradient(90% 70% at 50% 30%, rgba(27,22,38,.86), rgba(10,8,14,.97));
  opacity:0;transition:opacity .46s var(--ease);
  backdrop-filter:blur(3px);
}
.viewer.is-in .viewer__veil{opacity:1}

.viewer__stage{
  position:relative;height:100%;max-width:1180px;margin:0 auto;
  display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);
  gap:clamp(24px,4vw,60px);align-items:center;
}

/* 슬리브 + 판 — FLIP으로 원래 자리에서 날아온다 */
.viewer__art{position:relative;width:100%;aspect-ratio:1;will-change:transform}
.viewer__sleeve{
  position:absolute;inset:0;border-radius:6px;overflow:hidden;z-index:2;
  box-shadow:0 40px 90px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.1);
  background:var(--bg1,#2B2536);
}
.viewer__vinyl{
  position:absolute;top:4%;left:4%;width:92%;height:92%;border-radius:50%;z-index:1;
  background:
    radial-gradient(circle at 50% 50%, #2A2730 0 15%, transparent 15.4%),
    repeating-radial-gradient(circle at 50% 50%, #0E0D12 0 2.5px, #191820 2.5px 5px);
  box-shadow:0 30px 60px rgba(0,0,0,.6);
  transform:translateX(0) rotate(0deg);
  transition:transform .8s var(--ease);
}
.viewer.is-in .viewer__vinyl{transform:translateX(46%)}
.viewer.is-in .viewer__vinyl .spin{animation:spin 3.4s linear infinite}
.viewer__vinyl .spin{position:absolute;inset:0;border-radius:50%}
.viewer__vinyl .spin::before{
  content:"";position:absolute;inset:33%;border-radius:50%;
  background:var(--lpc,#FF6B5A);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.3), 0 0 26px rgba(0,0,0,.4);
}
.viewer__vinyl .spin::after{
  content:"";position:absolute;top:49%;left:24%;width:52%;height:2%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  border-radius:2px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.viewer__info{
  opacity:0;transform:translateY(22px);
  transition:opacity .5s .16s var(--ease), transform .5s .16s var(--ease);
  max-height:100%;overflow-y:auto;padding-right:6px;
}
.viewer.is-in .viewer__info{opacity:1;transform:none}
.vi__cat{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--lamp);margin:0 0 12px}
.vi__h{font-family:var(--display);font-size:clamp(28px,4.4vw,48px);line-height:1.12;margin:0 0 6px}
.vi__repo{font-family:var(--mono);font-size:12.5px;color:var(--cream-faint);display:block;margin-bottom:20px}
.vi__body p{margin:0 0 14px;font-size:15.5px;color:rgba(243,233,220,.82);line-height:1.8;max-width:56ch}
.vi__meta{
  display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 22px;list-style:none;padding:0;
}
.vi__meta li{
  font-family:var(--mono);font-size:11.5px;padding:5px 11px;border-radius:999px;
  border:1px solid rgba(243,233,220,.2);color:var(--cream-dim);
}
.vi__links{display:flex;gap:14px;flex-wrap:wrap}
.vi__links a{
  font-family:var(--mono);font-size:13px;text-decoration:none;
  padding:10px 18px;border-radius:999px;background:var(--lamp);color:#241A12;font-weight:500;
}
.vi__links a.ghost{background:transparent;color:var(--cream);border:1px solid rgba(243,233,220,.28)}
.vi__links a:hover{transform:translateY(-2px)}

.viewer__close{
  position:absolute;top:0;right:0;z-index:5;
  width:46px;height:46px;border-radius:50%;cursor:pointer;
  border:1px solid rgba(243,233,220,.24);background:rgba(0,0,0,.3);
  font-size:20px;line-height:1;
}
.viewer__close:hover{background:var(--lamp);color:#241A12;border-color:var(--lamp)}

.viewer__nav{
  position:absolute;bottom:0;left:0;display:flex;gap:10px;z-index:5;
}
.viewer__nav button{
  font-family:var(--mono);font-size:12px;padding:9px 16px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(243,233,220,.2);background:transparent;
}
.viewer__nav button:hover{border-color:var(--lamp);color:var(--lamp)}

/* ── 필터 ──────────────────────────────────── */
.filters{
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;
  padding:0 clamp(20px,4vw,54px) clamp(18px,2.5vw,28px);
}
.filters__k{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--cream-faint);margin-right:4px}
.f{
  font-family:var(--mono);font-size:12px;padding:6px 13px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(243,233,220,.18);background:transparent;color:var(--cream-dim);
  transition:.16s;
}
.f:hover{border-color:var(--lamp);color:var(--lamp)}
.f[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:#241A12}

/* ── 꼬리 ──────────────────────────────────── */
.tail{
  padding:clamp(30px,5vw,60px) clamp(20px,4vw,54px) clamp(40px,6vw,70px);
  border-top:1px solid rgba(243,233,220,.1);
  display:flex;flex-wrap:wrap;gap:22px;justify-content:space-between;align-items:flex-end;
}
.tail__h{font-family:var(--display);font-size:clamp(22px,3.4vw,34px);margin:0 0 8px}
.tail a.mail{font-family:var(--mono);font-size:15px;color:var(--lamp);text-decoration:none;border-bottom:1px solid rgba(255,184,107,.4)}
.tail__meta{font-family:var(--mono);font-size:11.5px;color:var(--cream-faint);text-align:right;line-height:1.9}

@media (max-width:880px){
  :root{--lp:148px}
  .viewer__stage{grid-template-columns:minmax(0,1fr);align-content:center;gap:22px;
    padding-top:56px;overflow-y:auto}
  .viewer__art{max-width:260px}
  .viewer.is-in .viewer__vinyl{transform:translateX(34%)}
  .tail__meta{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01ms!important}
  .viewer.is-in .viewer__vinyl{transform:translateX(30%)}
}
</style>
</head>

/* ── 렌더 ───────────────────────────────────── */
var crates = Array.prototype.slice.call(document.querySelectorAll('.crate'));

DATA.forEach(function(d, i){
  var b = document.createElement('button');
  b.className = 'lp';
  b.type = 'button';
  b.dataset.i = i;
  b.dataset.tags = d.tags.join(',');
  b.style.setProperty('--lpc', d.lpc);
  b.setAttribute('aria-label', d.name + ' 상세 보기');
  b.innerHTML =
    '<span class="peek" aria-hidden="true"></span>' +
    '<span class="sleeve" data-art="' + d.art + '" style="--bg1:' + d.bg + ';--c1:' + d.c1 + ';--c2:' + (d.c2||d.c1) + '">' +
      '<span class="sleeve__txt">' +
        '<span class="sleeve__cat">' + d.cat + '</span>' +
        '<span class="sleeve__name">' + d.name + '</span>' +
      '</span>' +
    '</span>';
  crates[d.shelf].appendChild(b);
});

/* ── 선반 드래그 · 휠 · 패럴랙스 ───────────── */
crates.forEach(function(crate, idx){
  var down = false, startX = 0, startScroll = 0, moved = 0;

  crate.addEventListener('pointerdown', function(e){
    down = true; moved = 0;
    startX = e.clientX; startScroll = crate.scrollLeft;
    crate.setPointerCapture(e.pointerId);
  });
  crate.addEventListener('pointermove', function(e){
    if (!down) return;
    var dx = e.clientX - startX;
    if (Math.abs(dx) > 4) crate.classList.add('is-dragging');
    moved = Math.abs(dx);
    crate.scrollLeft = startScroll - dx;
  });
  function end(e){
    down = false;
    crate.classList.remove('is-dragging');
    if (e && e.pointerId != null && crate.hasPointerCapture(e.pointerId)) crate.releasePointerCapture(e.pointerId);
  }
  crate.addEventListener('pointerup', end);
  crate.addEventListener('pointercancel', end);
  crate.addEventListener('click', function(e){ if (moved > 6) { e.preventDefault(); e.stopPropagation(); } }, true);

  crate.addEventListener('wheel', function(e){
    if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { crate.scrollLeft += e.deltaY; e.preventDefault(); }
  }, { passive:false });

  /* 선반마다 시작 위치를 다르게 — "따로 노는" 느낌 */
  crate.scrollLeft = [0, 74, 148][idx] || 0;
});

/* 마우스 위치에 따라 선반이 서로 다른 폭으로 흐른다 */
var shelves = Array.prototype.slice.call(document.querySelectorAll('.shelf'));
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (!reduce) {
  var tx = [0,0,0], target = [0,0,0], raf = null;
  window.addEventListener('pointermove', function(e){
    var n = (e.clientX / window.innerWidth) - 0.5;
    shelves.forEach(function(s,i){ target[i] = n * parseFloat(s.dataset.speed) * 260; });
    if (!raf) raf = requestAnimationFrame(tick);
  });
  function tick(){
    var busy = false;
    shelves.forEach(function(s,i){
      tx[i] += (target[i] - tx[i]) * 0.08;
      if (Math.abs(target[i] - tx[i]) > 0.2) busy = true;
      s.querySelector('.crate').style.transform = 'translateX(' + tx[i].toFixed(2) + 'px)';
    });
    raf = busy ? requestAnimationFrame(tick) : null;
  }
}

/* ── 필터 ───────────────────────────────────── */
var fbtns = Array.prototype.slice.call(document.querySelectorAll('.f'));
fbtns.forEach(function(fb){
  fb.addEventListener('click', function(){
    fbtns.forEach(function(x){ x.setAttribute('aria-pressed', String(x === fb)); });
    var tag = fb.dataset.tag;
    Array.prototype.forEach.call(document.querySelectorAll('.lp'), function(lp){
      var ok = tag === 'all' || lp.dataset.tags.split(',').indexOf(tag) !== -1;
      lp.classList.toggle('is-hidden', !ok);
    });
  });
});

/* ── 뷰어: FLIP 줌인 ────────────────────────── */
var viewer  = document.getElementById('viewer');
var vArt    = document.getElementById('vi-art');
var vSleeve = document.getElementById('vi-sleeve');
var vVinyl  = document.getElementById('vi-vinyl');
var current = -1, lastFocus = null;

function fill(d){
  vSleeve.dataset.art = d.art;
  vSleeve.style.cssText = '--bg1:' + d.bg + ';--c1:' + d.c1 + ';--c2:' + (d.c2||d.c1);
  vSleeve.innerHTML =
    '<span class="sleeve__txt"><span class="sleeve__cat">' + d.cat + '</span>' +
    '<span class="sleeve__name">' + d.name + '</span></span>';
  vSleeve.classList.add('sleeve');
  vVinyl.style.setProperty('--lpc', d.lpc);

  document.getElementById('vi-cat').textContent  = d.cat;
  document.getElementById('vi-h').textContent    = d.name;
  document.getElementById('vi-repo').textContent = d.repo;
  document.getElementById('vi-body').innerHTML   = d.body.map(function(p){ return '<p>' + p + '</p>'; }).join('');
  document.getElementById('vi-meta').innerHTML   = d.tags.map(function(t){ return '<li>' + t + '</li>'; }).join('');
  document.getElementById('vi-links').innerHTML  =
    '<a href="https://github.com/' + d.repo + '">GitHub 저장소</a>' +
    (d.live ? '<a class="ghost" href="#">배포된 사이트</a>' : '');
}

function open(i, srcEl){
  current = i;
  lastFocus = srcEl || document.activeElement;
  fill(DATA[i]);
  viewer.classList.add('is-open');

  /* FLIP — 눌린 판의 자리에서 무대 중앙으로 */
  var to = vArt.getBoundingClientRect();
  if (srcEl && to.width) {
    var from = srcEl.getBoundingClientRect();
    var s  = from.width / to.width;
    var dx = (from.left + from.width/2) - (to.left + to.width/2);
    var dy = (from.top + from.height/2) - (to.top + to.height/2);
    vArt.style.transition = 'none';
    vArt.style.transform  = 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')';
    vArt.getBoundingClientRect();  /* reflow */
    vArt.style.transition = 'transform .62s ' + 'cubic-bezier(.22,.9,.24,1)';
    vArt.style.transform  = 'none';
  }
  requestAnimationFrame(function(){ viewer.classList.add('is-in'); });
  document.body.style.overflow = 'hidden';
  document.getElementById('vi-h').setAttribute('tabindex','-1');
  setTimeout(function(){ document.getElementById('vi-h').focus(); }, 80);
}

function close(){
  var src = document.querySelector('.lp[data-i="' + current + '"]');
  viewer.classList.remove('is-in');
  if (src) {
    var to = vArt.getBoundingClientRect(), from = src.getBoundingClientRect();
    var s  = from.width / to.width;
    var dx = (from.left + from.width/2) - (to.left + to.width/2);
    var dy = (from.top + from.height/2) - (to.top + to.height/2);
    vArt.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')';
  }
  setTimeout(function(){
    viewer.classList.remove('is-open');
    vArt.style.transition = 'none';
    vArt.style.transform  = 'none';
    document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus();
  }, 440);
}

document.addEventListener('click', function(e){
  var lp = e.target.closest('.lp');
  if (lp) { open(+lp.dataset.i, lp); return; }
  if (e.target.closest('[data-close]')) close();
  var step = e.target.closest('[data-step]');
  if (step) {
    var next = (current + (+step.dataset.step) + DATA.length) % DATA.length;
    fill(DATA[next]); current = next;
  }
});
document.addEventListener('keydown', function(e){
  if (!viewer.classList.contains('is-open')) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowRight') { current = (current+1)%DATA.length; fill(DATA[current]); }
  if (e.key === 'ArrowLeft')  { current = (current-1+DATA.length)%DATA.length; fill(DATA[current]); }
});
</script>
